<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A2F3A">
<link rel="manifest" href="/manifest.json">
<title>排程發送 — 意轉靈升工作坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f5;
  color: #333;
}
.topbar {
  background: #1A2F3A;
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-link { color: #ccc; text-decoration: none; font-size: 14px; }
.topbar-link:hover { color: #fff; }
.topbar-link.active { color: #D4A84B; font-weight: 600; }
.container { max-width: 700px; margin: 0 auto; padding: 24px; }
.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; color: #1A2F3A; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 6px;
  margin-top: 14px;
}
label:first-child { margin-top: 0; }
textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  min-height: 100px;
  resize: vertical;
}
textarea:focus { outline: none; border-color: #2E8B7A; }
select, input[type="datetime-local"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
}
select:focus, input:focus { outline: none; border-color: #2E8B7A; }
.preview-box {
  background: #e8f5f2;
  border: 1px solid #b2dfdb;
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 14px;
  font-size: 14px;
  color: #666;
}
.preview-box strong { color: #2E8B7A; }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-primary {
  flex: 1;
  padding: 14px;
  background: #2E8B7A;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:hover { background: #267A6B; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.history-item {
  background: #fff;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.history-content { flex: 1; min-width: 0; }
.history-text { font-size: 14px; line-height: 1.5; margin-bottom: 6px; word-break: break-word; }
.history-meta { font-size: 12px; color: #aaa; }
.history-meta span { margin-right: 12px; }
.status-badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.status-pending { background: #fff3e0; color: #e65100; }
.status-sent { background: #e0f2f1; color: #00695c; }
.delete-btn {
  background: none;
  border: none;
  color: #ccc;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
}
.delete-btn:hover { color: #e74c3c; }
.empty { text-align: center; color: #aaa; padding: 30px; font-size: 14px; }
.char-count { font-size: 12px; color: #aaa; text-align: right; margin-top: 4px; }
.contact-picker {
  margin-top: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  max-height: 250px;
  overflow-y: auto;
}
.picker-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: #e8f5f2;
  border-bottom: 1px solid #e0e0e0;
  position: sticky;
  top: 0;
}
.picker-toolbar span { font-size: 13px; color: #2E8B7A; font-weight: 600; }
.picker-toolbar button {
  background: none;
  border: none;
  color: #2E8B7A;
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
}
.contact-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  transition: background 0.1s;
}
.contact-row:last-child { border-bottom: none; }
.contact-row:hover { background: #e8f5f2; }
.contact-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #2E8B7A;
  cursor: pointer;
}
.contact-row .c-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #2E8B7A;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}
.contact-row .c-name { font-size: 14px; flex: 1; }
.contact-row .c-stage {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}
.c-stage-catch { background: #e0f2f1; color: #00695c; }
.c-stage-warm { background: #fff3e0; color: #e65100; }
.c-stage-convert { background: #e8eaf6; color: #283593; }
.picker-search {
  width: 100%;
  padding: 8px 12px;
  border: none;
  border-bottom: 1px solid #e0e0e0;
  font-size: 14px;
  font-family: inherit;
}
.picker-search:focus { outline: none; background: #f5faf9; }
@media (max-width: 600px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  .topbar h1 { font-size: 16px; }
  .topbar-right { gap: 10px; width: 100%; justify-content: flex-end; }
  .topbar-link { font-size: 13px; }
  .container { padding: 16px; }
}
</style>
</head>
<body>
<div class="topbar">
  <h1>意轉靈升工作坊</h1>
  <div class="topbar-right">
    <a href="/dashboard/inbox" class="topbar-link">收件匣</a>
    <a href="/dashboard/courses" class="topbar-link">課程</a>
    <a href="/dashboard/broadcast" class="topbar-link active">排程</a>
    <a href="/dashboard/settings" class="topbar-link">設定</a>
    <a href="#" class="topbar-link" id="logoutBtn">登出</a>
  </div>
</div>
<div class="container">
  <div class="card">
    <h2>新增排程訊息</h2>
    <label>訊息內容</label>
    <textarea id="content" placeholder="輸入要發送的訊息..."></textarea>
    <div class="char-count"><span id="charCount">0</span> 字</div>

    <label>發送對象</label>
    <select id="target" onchange="onTargetChange()">
      <option value="all">所有聯絡人</option>
      <option value="stage">依對話階段篩選</option>
      <option value="pick">手動勾選</option>
    </select>

    <div id="stageRow" style="display:none;">
      <label>選擇階段</label>
      <select id="targetStage" onchange="updatePreview()">
        <option value="catch">接住（0-2天）</option>
        <option value="warm">養溫（3-5天）</option>
        <option value="convert">轉化（5天+）</option>
      </select>
    </div>

    <div id="pickRow" style="display:none;">
      <div class="contact-picker">
        <input type="text" class="picker-search" id="pickerSearch" placeholder="搜尋聯絡人..." oninput="filterContacts()">
        <div class="picker-toolbar">
          <span id="selectedCount">已選 0 人</span>
          <div>
            <button onclick="selectAll()">全選</button>
            <button onclick="deselectAll()">取消全選</button>
          </div>
        </div>
        <div id="contactList"></div>
      </div>
    </div>

    <label>發送時間</label>
    <select id="timeType" onchange="toggleTimeInput()">
      <option value="now">立即發送</option>
      <option value="schedule">排程發送</option>
    </select>
    <div id="scheduleRow" style="display:none; margin-top: 8px;">
      <input type="datetime-local" id="scheduledAt">
    </div>

    <div class="preview-box" id="previewBox">載入中...</div>

    <div class="btn-row">
      <button class="btn-primary" id="sendBtn" onclick="createBroadcast()">確認發送</button>
    </div>
  </div>

  <div class="card">
    <h2>發送紀錄</h2>
    <div id="historyList"><div class="empty">載入中...</div></div>
  </div>
</div>
<script>
let allContacts = [];

document.getElementById('content').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

function onTargetChange() {
  const val = document.getElementById('target').value;
  document.getElementById('stageRow').style.display = val === 'stage' ? 'block' : 'none';
  document.getElementById('pickRow').style.display = val === 'pick' ? 'block' : 'none';
  if (val === 'pick') { loadContactList(); } else { updatePreview(); }
}

function toggleTimeInput() {
  document.getElementById('scheduleRow').style.display = document.getElementById('timeType').value === 'schedule' ? 'block' : 'none';
}

async function loadContactList() {
  try {
    const res = await fetch('/api/broadcast/preview?target=all');
    const data = await res.json();
    allContacts = data.contacts;
    renderContactList(allContacts);
    updatePickPreview();
  } catch (e) {
    document.getElementById('contactList').innerHTML = '<div class="empty">載入失敗</div>';
  }
}

function renderContactList(contacts) {
  const stageNames = { catch: '接住', warm: '養溫', convert: '轉化' };
  document.getElementById('contactList').innerHTML = contacts.map(c => {
    const initial = (c.display_name || '?')[0];
    return '<label class="contact-row" data-id="' + c.id + '">' +
      '<input type="checkbox" value="' + c.id + '" onchange="updatePickPreview()">' +
      '<div class="c-avatar">' + escapeHtml(initial) + '</div>' +
      '<span class="c-name">' + escapeHtml(c.display_name || '未知用戶') + '</span>' +
      '<span class="c-stage c-stage-' + c.stage + '">' + (stageNames[c.stage] || c.stage) + '</span>' +
    '</label>';
  }).join('');
}

function filterContacts() {
  const keyword = document.getElementById('pickerSearch').value.trim().toLowerCase();
  if (!keyword) { renderContactList(allContacts); return; }
  renderContactList(allContacts.filter(c => (c.display_name || '').toLowerCase().includes(keyword)));
}

function getSelectedIds() {
  return Array.from(document.querySelectorAll('#contactList input[type="checkbox"]:checked')).map(cb => parseInt(cb.value));
}

function selectAll() {
  document.querySelectorAll('#contactList input[type="checkbox"]').forEach(cb => cb.checked = true);
  updatePickPreview();
}

function deselectAll() {
  document.querySelectorAll('#contactList input[type="checkbox"]').forEach(cb => cb.checked = false);
  updatePickPreview();
}

function updatePickPreview() {
  const ids = getSelectedIds();
  const names = allContacts.filter(c => ids.includes(c.id)).map(c => c.display_name || '未知');
  document.getElementById('selectedCount').textContent = '已選 ' + ids.length + ' 人';
  let text = '將發送給 <strong>' + ids.length + ' 位</strong>聯絡人';
  if (ids.length > 0) {
    text += '<br>' + names.slice(0, 5).join('、');
    if (ids.length > 5) text += '...等';
  }
  document.getElementById('previewBox').innerHTML = text;
}

async function updatePreview() {
  const target = document.getElementById('target').value;
  if (target === 'pick') { updatePickPreview(); return; }
  const stage = document.getElementById('targetStage').value;
  const params = new URLSearchParams({ target });
  if (target === 'stage') params.set('target_stage', stage);
  try {
    const res = await fetch('/api/broadcast/preview?' + params);
    const data = await res.json();
    const stageNames = { catch: '接住', warm: '養溫', convert: '轉化' };
    let text = '將發送給 <strong>' + data.count + ' 位</strong>聯絡人';
    if (target === 'stage') text += '（' + stageNames[stage] + '階段）';
    if (data.count > 0) {
      text += '<br>' + data.contacts.slice(0, 5).map(c => c.display_name || '未知').join('、');
      if (data.count > 5) text += '...等';
    }
    document.getElementById('previewBox').innerHTML = text;
  } catch (e) {
    document.getElementById('previewBox').innerHTML = '無法載入預覽';
  }
}

async function createBroadcast() {
  const content = document.getElementById('content').value.trim();
  if (!content) { alert('請輸入訊息內容'); return; }
  const target = document.getElementById('target').value;
  const targetStage = target === 'stage' ? document.getElementById('targetStage').value : null;
  const timeType = document.getElementById('timeType').value;
  let contactIds = null;
  if (target === 'pick') {
    contactIds = getSelectedIds();
    if (contactIds.length === 0) { alert('請至少勾選一位聯絡人'); return; }
  }
  let scheduledAt;
  if (timeType === 'now') {
    scheduledAt = new Date().toISOString();
  } else {
    const val = document.getElementById('scheduledAt').value;
    if (!val) { alert('請選擇發送時間'); return; }
    scheduledAt = new Date(val).toISOString();
  }
  const action = timeType === 'now' ? '立即發送' : '排程發送';
  const count = target === 'pick' ? contactIds.length : '符合條件的';
  if (!confirm('確定要' + action + '給 ' + count + ' 人嗎？')) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '處理中...';
  try {
    const res = await fetch('/api/broadcasts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, target, target_stage: targetStage, scheduled_at: scheduledAt, contact_ids: contactIds }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || '發送失敗'); return; }
    alert('已建立！預計發送給 ' + data.recipient_count + ' 人');
    document.getElementById('content').value = '';
    document.getElementById('charCount').textContent = '0';
    loadHistory();
  } catch (e) {
    alert('操作失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '確認發送';
  }
}

async function loadHistory() {
  try {
    const res = await fetch('/api/broadcasts');
    const list = await res.json();
    const el = document.getElementById('historyList');
    if (list.length === 0) { el.innerHTML = '<div class="empty">還沒有發送紀錄</div>'; return; }
    el.innerHTML = list.map(b => {
      const stageNames = { catch: '接住', warm: '養溫', convert: '轉化' };
      const targetText = b.target === 'stage' ? stageNames[b.target_stage] + '階段' : b.target === 'pick' ? '手動勾選' : '全部';
      let statusClass = 'status-' + b.status;
      let statusText = b.status === 'pending' ? '待發送' : b.status === 'sent' ? '已發送' : b.status;
      let metaText = '對象：' + targetText;
      if (b.status === 'sent') metaText += ' | 成功 ' + b.sent_count + (b.fail_count > 0 ? ' 失敗 ' + b.fail_count : '');
      metaText += ' | ' + formatTime(b.status === 'sent' ? b.sent_at : b.scheduled_at);
      if (b.created_by) metaText += ' | ' + b.created_by;
      const deleteBtn = b.status === 'pending' ? '<button class="delete-btn" onclick="deleteBroadcast(' + b.id + ')" title="取消">&times;</button>' : '';
      return '<div class="history-item"><div class="history-content"><div class="history-text">' +
        escapeHtml(b.content.substring(0, 100)) + (b.content.length > 100 ? '...' : '') +
        '</div><div class="history-meta"><span>' + metaText + '</span></div></div>' +
        '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' + deleteBtn + '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('historyList').innerHTML = '<div class="empty">載入失敗</div>';
  }
}

async function deleteBroadcast(id) {
  if (!confirm('確定要取消這則排程訊息嗎？')) return;
  await fetch('/api/broadcasts/' + id, { method: 'DELETE' });
  loadHistory();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/dashboard/logout', { method: 'POST' });
  window.location.href = '/dashboard/login';
});

updatePreview();
loadHistory();
</script>
</body>
</html>
