<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A2F3A">
<link rel="manifest" href="/manifest.json">
<title>登入 — 意轉靈升工作坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #0F2027 0%, #203A43 50%, #2C5364 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-card {
  background: #fff;
  border-radius: 16px;
  padding: 48px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
.login-card h1 {
  color: #1A2F3A;
  font-size: 22px;
  margin-bottom: 8px;
}
.login-card p {
  color: #888;
  font-size: 14px;
  margin-bottom: 32px;
}
.form-group {
  margin-bottom: 20px;
  text-align: left;
}
.form-group label {
  display: block;
  font-size: 14px;
  color: #555;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 16px;
  transition: border-color 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: #2E8B7A;
}
.btn {
  width: 100%;
  padding: 14px;
  background: #2E8B7A;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn:hover { background: #267A6B; }
.error {
  color: #e74c3c;
  font-size: 14px;
  margin-top: 12px;
  display: none;
}
</style>
</head>
<body>
<div class="login-card">
  <h1>意轉靈升工作坊</h1>
  <p>LINE 自動回覆管理系統</p>
  <form id="loginForm">
    <div class="form-group">
      <label>帳號</label>
      <input type="text" id="username" placeholder="輸入你的名字" required>
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input type="password" id="password" placeholder="輸入密碼" required>
    </div>
    <button type="submit" class="btn">登入</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/dashboard/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/dashboard/inbox';
    } else {
      errEl.textContent = data.error || '登入失敗';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = '連線錯誤，請稍後再試';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
