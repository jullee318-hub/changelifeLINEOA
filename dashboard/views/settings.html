<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A2F3A">
<link rel="manifest" href="/manifest.json">
<title>設定 — 意轉靈升工作坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f5;
  color: #333;
}
.topbar {
  background: #1A2F3A;
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-link { color: #ccc; text-decoration: none; font-size: 14px; }
.topbar-link:hover { color: #fff; }
.topbar-link.active { color: #D4A84B; font-weight: 600; }
.container { max-width: 600px; margin: 0 auto; padding: 24px; }
.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; color: #1A2F3A; }
.card p { font-size: 14px; color: #888; margin-bottom: 12px; }
.toggle-group {
  display: flex;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid #e0e0e0;
}
.toggle-btn {
  flex: 1;
  padding: 14px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: #fff;
  color: #888;
  transition: all 0.2s;
}
.toggle-btn.active { background: #2E8B7A; color: #fff; }
.toggle-btn:hover:not(.active) { background: #f0f0f0; }
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: #888; }
.info-value { font-weight: 500; }
.word-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.word-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
.word-ok { background: #e0f2f1; color: #00695c; }
.word-no { background: #ffebee; color: #c62828; }
.status-msg {
  text-align: center;
  font-size: 14px;
  color: #27ae60;
  margin-top: 12px;
  min-height: 20px;
}
@media (max-width: 600px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  .topbar h1 { font-size: 16px; }
  .topbar-right { gap: 10px; width: 100%; justify-content: flex-end; }
  .topbar-link { font-size: 13px; }
  .container { padding: 16px; }
}
</style>
</head>
<body>
<div class="topbar">
  <h1>意轉靈升工作坊</h1>
  <div class="topbar-right">
    <a href="/dashboard/inbox" class="topbar-link">收件匣</a>
    <a href="/dashboard/courses" class="topbar-link">課程</a>
    <a href="/dashboard/broadcast" class="topbar-link">排程</a>
    <a href="/dashboard/settings" class="topbar-link active">設定</a>
    <a href="#" class="topbar-link" id="logoutBtn">登出</a>
  </div>
</div>
<div class="container">
  <div class="card">
    <h2>回覆模式</h2>
    <p>全自動：AI 直接回覆觀眾<br>半自動：AI 擬稿，你確認後才送出</p>
    <div class="toggle-group">
      <button class="toggle-btn" id="btnSemi" onclick="setMode('semi-auto')">半自動</button>
      <button class="toggle-btn" id="btnAuto" onclick="setMode('auto')">全自動</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card">
    <h2>系統資訊</h2>
    <div class="info-row">
      <span class="info-label">AI 模型</span>
      <span class="info-value" id="modelName">載入中</span>
    </div>
    <div class="info-row">
      <span class="info-label">LINE 帳號</span>
      <span class="info-value">意轉靈升工作坊 @524ncpct</span>
    </div>
    <div class="info-row">
      <span class="info-label">登入身分</span>
      <span class="info-value" id="operatorName">載入中</span>
    </div>
  </div>

  <div class="card">
    <h2>語氣規範參考</h2>
    <p>可以用的詞：</p>
    <div class="word-list">
      <span class="word-tag word-ok">能量</span>
      <span class="word-tag word-ok">頻率</span>
      <span class="word-tag word-ok">信念</span>
      <span class="word-tag word-ok">轉化</span>
      <span class="word-tag word-ok">覺醒</span>
      <span class="word-tag word-ok">療癒</span>
      <span class="word-tag word-ok">校準</span>
      <span class="word-tag word-ok">釋放</span>
      <span class="word-tag word-ok">連結</span>
      <span class="word-tag word-ok">覺察</span>
    </div>
    <p style="margin-top: 16px;">禁止用的詞：</p>
    <div class="word-list">
      <span class="word-tag word-no">開天眼</span>
      <span class="word-tag word-no">通靈</span>
      <span class="word-tag word-no">靈異</span>
      <span class="word-tag word-no">驅邪</span>
      <span class="word-tag word-no">保證開悟</span>
      <span class="word-tag word-no">財富自由</span>
      <span class="word-tag word-no">吸引力法則</span>
    </div>
  </div>
</div>
<script>
async function load() {
  const [settingsRes, meRes] = await Promise.all([
    fetch('/api/settings'), fetch('/api/me')
  ]);
  const settings = await settingsRes.json();
  const me = await meRes.json();

  document.getElementById('modelName').textContent = settings.ai_model;
  document.getElementById('operatorName').textContent = me.username;

  document.getElementById('btnSemi').classList.toggle('active', settings.reply_mode === 'semi-auto');
  document.getElementById('btnAuto').classList.toggle('active', settings.reply_mode === 'auto');
}

async function setMode(mode) {
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reply_mode: mode }),
  });
  const msg = document.getElementById('statusMsg');
  msg.textContent = mode === 'auto' ? '已切換為全自動模式' : '已切換為半自動模式';
  setTimeout(() => msg.textContent = '', 3000);
  load();
}

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/dashboard/logout', { method: 'POST' });
  window.location.href = '/dashboard/login';
});

load();
</script>
</body>
</html>
